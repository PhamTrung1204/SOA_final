services:
  consul:
    image: hashicorp/consul:latest
    ports:
      - "8500:8500"
    networks:
      - salon-network
    command: "agent -dev -client=0.0.0.0"

  customerservice:
    build:
      context: .
      dockerfile: ./CustomerService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONSUL_HOST=consul
      - SERVICE_HOST=customerservice
      - SERVICE_PORT=8080
      - Jwt__Key=3coderlochuanbibaocaodoankientrucphanmemhuongdichvu@#$@$#
      - Jwt__Issuer=SalonManagementSystem
      - Jwt__Audience=SalonManagementSystem
    networks:
      - salon-network
    depends_on:
      - consul

  staffservice:
    build:
      context: .
      dockerfile: ./StaffService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONSUL_HOST=consul
      - SERVICE_HOST=staffservice
      - SERVICE_PORT=8080
    networks:
      - salon-network
    depends_on:
      - consul

  serviceservice:
    build:
      context: .
      dockerfile: ./ServiceService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONSUL_HOST=consul
      - SERVICE_HOST=serviceservice
      - SERVICE_PORT=8080
    networks:
      - salon-network
    depends_on:
      - consul

  appointmentservice:
    build:
      context: .
      dockerfile: ./AppointmentService/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONSUL_HOST=consul
      - SERVICE_HOST=appointmentservice
      - SERVICE_PORT=8080
    networks:
      - salon-network
    depends_on:
      - consul

  paymentservice:
    build:
      context: .
      dockerfile: ./PaymentService/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONSUL_HOST=consul
      - SERVICE_HOST=paymentservice
      - SERVICE_PORT=8080
    networks:
      - salon-network
    depends_on:
      - consul

  feedbackservice:
    build:
      context: .
      dockerfile: ./FeedbackService/Dockerfile
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONSUL_HOST=consul
      - SERVICE_HOST=feedbackservice
      - SERVICE_PORT=8080
    networks:
      - salon-network
    depends_on:
      - consul

  apigateway:
    build:
      context: .
      dockerfile: ./APIGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONSUL_HOST=consul
    networks:
      - salon-network
    depends_on:
      - consul
      - customerservice
      - staffservice
      - serviceservice
      - appointmentservice
      - paymentservice
      - feedbackservice

  webapp:
    build:
      context: .
      dockerfile: ./WebApp/Dockerfile
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - GATEWAY_URL=http://apigateway:8080
    volumes:
      - webapp-keys:/app/keys
    networks:
      - salon-network
    depends_on:
      - apigateway

networks:
  salon-network:
    driver: bridge

volumes:
  webapp-keys: